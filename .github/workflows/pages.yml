name: Publish NeuroQuest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore missing photographs
        run: bash scripts/fetch-images.sh
      - name: Preserve photographs in repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/real_cat.jpg assets/real_astronaut.jpg assets/real_rocket.jpg assets/real_coffee.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Restore local photographs used by quiz"
            git push origin HEAD:main
          fi
      - name: Verify all image files
        run: node tests/assets.cjs
      - name: Verify JavaScript syntax
        run: node --check script.js && node --check config.js
      - name: Test game startup and finale
        run: node tests/smoke.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
